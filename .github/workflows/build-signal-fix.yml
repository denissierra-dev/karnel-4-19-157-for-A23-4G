name: Build A23 rild Signal Fix

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'gsi-fixes/rild-signal-fix/**'
      - '.github/workflows/build-signal-fix.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate or install Android NDK
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK=$(ls -d "$SDK_DIR"/ndk/* /usr/local/lib/android/sdk/ndk-bundle 2>/dev/null | sort -V | tail -n1 || true)
          fi
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "cmake;3.22.1"
            NDK="$SDK_DIR/ndk/27.2.12479018"
          fi
          echo "Using NDK: $NDK"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - name: Configure and compile rild (arm64-v8a, API 30)
        run: |
          cmake -S gsi-fixes/rild-signal-fix -B build-signal \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-30 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-signal -j

      - name: Verify ELF dependencies and strip binary
        run: |
          READELF="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          STRIP="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          "$STRIP" --strip-unneeded build-signal/rild
          file build-signal/rild
          ls -lh build-signal/rild
          "$READELF" -d build-signal/rild

      - name: Upload rild binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: a23-rild-signal-fix
          path: build-signal/rild
